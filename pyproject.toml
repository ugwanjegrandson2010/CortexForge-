[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexforge"
version = "1.0.0"
description = "Adaptive learning system with behavioural profiling, spaced repetition, and honest feedback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CortexForge" }]
keywords = ["learning", "spaced-repetition", "fsrs", "bkt", "irt", "mcp", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
cortexforge = "cortexforge.server:main"
cortexforge-tui = "cortexforge.tui:main"

[project.urls]
Homepage = "https://github.com/ugwanjegrandson2010/cortexforge"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortexforge = ["py.typed"]
